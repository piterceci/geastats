<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#101826">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#1b2438; --muted:#5d6779; --line:#d5dbe4;
  --wood:#e3b77d; --woodline:#8a5a2b; --paint:#c9894a;
  --navy:#1f3a68; --amber:#e9a100; --made:#23875a; --miss:#c3402f; --chip:#e6eaf1; --chipOn:#1f3a68; --chipOnInk:#fff;
  --score:#101826; --scoreInk:#ffd166;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121722; --panel:#1b2230; --ink:#e7ebf2; --muted:#9aa4b5; --line:#2e3748;
    --wood:#7a5a33; --woodline:#e3c08f; --paint:#8f6233;
    --navy:#7fa6e8; --amber:#ffc23d; --made:#43c08a; --miss:#ff6b57; --chip:#263042; --chipOn:#7fa6e8; --chipOnInk:#0e1420;
    --score:#0a0e16; --scoreInk:#ffd166; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#121722; --panel:#1b2230; --ink:#e7ebf2; --muted:#9aa4b5; --line:#2e3748;
    --wood:#7a5a33; --woodline:#e3c08f; --paint:#8f6233;
    --navy:#7fa6e8; --amber:#ffc23d; --made:#43c08a; --miss:#ff6b57; --chip:#263042; --chipOn:#7fa6e8; --chipOnInk:#0e1420;
    --score:#0a0e16; --scoreInk:#ffd166; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--score)}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
h2{font-size:1.5rem;margin:1.2rem 0 .5rem;font-weight:700}
h3{font-size:1.15rem;margin:1rem 0 .4rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--score);color:#e9edf5}
.nav{display:flex;gap:2px;overflow-x:auto;padding:0 .5rem}
.nav button{background:none;border:0;color:#aab4c6;padding:.7rem .9rem;font:600 1.05rem "Barlow Condensed",sans-serif;border-bottom:3px solid transparent;white-space:nowrap}
.nav button.on{color:#fff;border-bottom-color:var(--amber)}
.brand{font:700 1.2rem "Barlow Condensed",sans-serif;padding:.7rem .6rem .7rem .4rem;color:var(--scoreInk)}
main{max-width:1180px;margin:0 auto;padding:.75rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.9rem;margin-bottom:.8rem}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:.5rem .75rem;min-height:44px;min-width:44px}
.chip.on{background:var(--chipOn);color:var(--chipOnInk);border-color:var(--chipOn)}
.chip.made.on{background:var(--made);border-color:var(--made);color:#fff}
.chip.miss.on{background:var(--miss);border-color:var(--miss);color:#fff}
.btn{border:0;border-radius:8px;padding:.6rem 1rem;min-height:44px;background:var(--navy);color:var(--chipOnInk);font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--miss);color:#fff}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem;min-height:44px}
input[type=number]{width:4.2rem}
label.f{display:flex;flex-direction:column;gap:.2rem;font-size:.9rem;color:var(--muted)}
label.f>*{color:var(--ink)}
/* tabellone */
.board{background:var(--score);color:#fff;border-radius:10px;padding:.6rem .8rem;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.5rem;margin-bottom:.7rem}
.board .t{font:600 1rem "Barlow Condensed",sans-serif;color:#c4cbd8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .s{font:700 3rem/1 "Barlow Condensed",sans-serif;color:var(--scoreInk);font-variant-numeric:tabular-nums}
.board .mid{text-align:center}
.board .clock{font:700 1.9rem/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;background:none;border:0;color:#fff;padding:.2rem .4rem}
.board .fouls{font-size:.82rem;color:#c4cbd8}
.board .right{text-align:right}
.qbar{display:flex;gap:.3rem;justify-content:center;margin-top:.3rem;flex-wrap:wrap}
.qbar button{background:#26324a;border:0;color:#cfd6e3;border-radius:6px;min-width:38px;min-height:36px;font-weight:600}
.qbar button.on{background:var(--amber);color:#111}
.oncourt{font-size:.85rem;color:#dfe5ef;margin-top:.35rem;line-height:1.35}.oncourt b{color:var(--scoreInk);font-weight:600}
.board .s{font-size:3.4rem}
.bonus{background:var(--miss);color:#fff;font-weight:700;padding:.05rem .4rem;border-radius:4px;font-size:.8rem}
.pdfbox table{font-size:8.5px}.pdfbox th,.pdfbox td{padding:2px 3px}.pdfbox .tw{overflow:visible}.pdfbox .kpi b{font-size:1.15rem}.pdfbox .layout2,.pdfbox .cols2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.pdfbox h2{font-size:1.3rem}
.mapstack .court{max-width:520px}.pdfbox .layout2{grid-template-columns:1fr!important}.pdfbox .mapstack{width:370px;margin:0 auto}.pdfbox .pmaps .mapstack{width:300px}.pdfbox .court{margin:0!important;max-width:none!important;width:100%}.pdfbox table{font-size:8.5px;width:100%;table-layout:auto}.pdfbox th,.pdfbox td{white-space:nowrap}
body[data-role=player] .noprint button[data-a=fullReport]{display:none}body[data-role=player] [data-a=gNew],body[data-role=player] [data-a=evEdit]{display:none}
.kbd{font:600 .75rem Barlow,sans-serif;opacity:.7;margin-left:.25rem}
.tabs{display:flex;gap:.3rem;margin-bottom:.6rem;flex-wrap:wrap}
.tabs .chip{font-weight:600}
/* campo */
.court{width:100%;max-width:620px;display:block;margin:0 auto;touch-action:manipulation;border-radius:8px}
.court .fl{fill:var(--wood)}
.court.att .fl,.fullcourt .att .fl{fill:#a9c8f2}.fullcourt .att .pt{fill:#2f6fd6;opacity:.55}.fullcourt .att .ln{stroke:#2a4a80}.fullcourt .def .fl{fill:#f4b3ab}.fullcourt .def .pt{fill:#d6455a;opacity:.55}.fullcourt .def .ln{stroke:#8a3324}
.fullcourt{max-width:none;cursor:crosshair}.fclab{font:600 5px Barlow,sans-serif;text-anchor:middle;fill:#333;opacity:.75;pointer-events:none}.court.att .fl{fill:#a9c8f2}.court.att .pt{fill:#2f6fd6;opacity:.55}.court.att .ln{stroke:#2a4a80}
.court.def .fl{fill:#f4b3ab}.court.def .pt{fill:#d6455a;opacity:.55}.court.def .ln{stroke:#8a3324}
.cols2{display:grid;grid-template-columns:minmax(0,1fr);gap:.8rem}
@media (min-width:700px){.cols2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.cols2 .acts button{min-width:40px;min-height:44px;font-size:.74rem;padding:0 .3rem}
.cols2 .prow{grid-template-columns:5.6rem 1fr}
.court .pt{fill:var(--paint);opacity:.55}
.court .ln{fill:none;stroke:var(--woodline);stroke-width:.6}
.dotm{fill:var(--made);stroke:#fff;stroke-width:.4}
.dotx{stroke:var(--miss);stroke-width:1.1}
.zl{font:700 4.2px "Barlow Condensed",sans-serif;text-anchor:middle;dominant-baseline:middle;fill:#fff;pointer-events:none}
.zs{font:500 2.9px Barlow,sans-serif;text-anchor:middle;fill:#fff;pointer-events:none}
.layout2{display:grid;grid-template-columns:minmax(0,1fr);gap:.8rem}
@media (min-width:900px){.layout2{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}}
/* azioni */
.prow{display:grid;grid-template-columns:7.5rem 1fr;gap:.4rem;align-items:center;padding:.35rem 0;border-bottom:1px solid var(--line)}
.prow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:.3rem;flex-wrap:wrap}
.acts button{min-width:58px;min-height:52px;border-radius:8px;border:1px solid var(--line);background:var(--chip);font-weight:600;font-size:.9rem}
.acts .g{color:var(--made)} .acts .r{color:var(--miss)}
/* tabelle */
.tw{overflow-x:auto;max-width:100%}
.panel,.cols2>*,.layout2>*{min-width:0}
main{overflow-x:clip}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th[title],.kpi span[title]{cursor:help;text-decoration:underline dotted;text-underline-offset:3px}
th,td{padding:.38rem .45rem;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 .9rem "Barlow Condensed",sans-serif;color:var(--muted);position:sticky;top:0;background:var(--panel)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
tr.tot td{font-weight:700}
.bar{height:10px;border-radius:5px;background:var(--navy)}
/* sheet */
.sheetbg{position:fixed;inset:0;background:rgba(5,10,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){.sheetbg{align-items:center}.sheet{border-radius:14px}}
.sheet h3{margin-top:0}
.grp{margin:.55rem 0}
.grp>.lab{font-size:.85rem;color:var(--muted);margin-bottom:.25rem}
.toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--score);color:#fff;padding:.6rem 1rem;border-radius:8px;z-index:30;max-width:90vw}
.log{max-height:60vh;overflow:auto}
.log .it{display:flex;gap:.5rem;align-items:center;padding:.35rem 0;border-bottom:1px solid var(--line)}
.tag{font:600 .8rem "Barlow Condensed",sans-serif;padding:.1rem .4rem;border-radius:4px;background:var(--chip)}
.okc{color:var(--made);font-weight:600} .koc{color:var(--miss);font-weight:600}
.empty{padding:1.2rem;text-align:center;color:var(--muted)}
.warn{border-left:4px solid var(--amber);padding:.5rem .7rem;background:var(--chip);border-radius:6px;font-size:.92rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:.5rem}
.kpi{border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem}
.kpi b{display:block;font:700 1.6rem/1.1 "Barlow Condensed",sans-serif}
.kpi span{font-size:.82rem;color:var(--muted)}

/* v2 mobile + colori */
.esito{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.4rem 0 .6rem}
.esito .big{min-height:60px;border-radius:12px;font:inherit;font-weight:700;font-size:1.1rem;border:0;color:#fff;opacity:.55}
.esito .big.on{opacity:1;box-shadow:0 0 0 3px #fff inset}
.esito .made{background:var(--made)} .esito .miss{background:var(--miss)}

.sg{border-left:4px solid var(--c,#888);padding:.35rem 0 .35rem .6rem;margin:.5rem 0}
.sg .lab{color:var(--c);font-weight:700}
.sg .chip.on{background:var(--c);border-color:var(--c);color:#0e1420}
.c-who{--c:#7fa6e8}.c-orig{--c:#c39bff}.c-ast{--c:#ffc23d}.c-sch{--c:#4fd1c5}.c-def{--c:#ff8a7a}.c-cont{--c:#a0aec0}.c-val{--c:#8892a6}
.vtag{font-size:.8rem;background:var(--chip);border-radius:6px;padding:.1rem .4rem;vertical-align:middle}
.savebar{position:sticky;bottom:calc(-1rem - env(safe-area-inset-bottom,0px));background:var(--panel);display:grid;grid-template-columns:auto 1fr;gap:.5rem;padding:.6rem 0 calc(.6rem + env(safe-area-inset-bottom,0px));margin-top:.6rem;border-top:1px solid var(--line)}
.savebar .save{min-height:54px;font-size:1.1rem}.savebar .okb{background:var(--made);color:#fff}.savebar .kob{background:var(--miss);color:#fff}
.acts button.a-ok{background:var(--made);color:#fff;border-color:var(--made)}
.acts button.a-ko{background:var(--miss);color:#fff;border-color:var(--miss)}
.acts button.a-reb{background:#2b4a7e;color:#fff;border-color:#2b4a7e}
.acts button.a-ok2{color:var(--made);border-color:var(--made)}
.acts button.a-ko2{color:var(--miss);border-color:var(--miss)}
.acts button.a-st{color:#4fd1c5;border-color:#4fd1c5}
.acts button.a-foul{background:#6b5310;color:#ffd77a;border-color:#a8841c}
.acts button.a-fs{color:#c39bff;border-color:#c39bff}
@media (max-width:600px){
 .nav{overflow-x:auto;scrollbar-width:none}
 .board{grid-template-columns:1fr 1fr;grid-template-areas:"l r" "m m";padding:.5rem .6rem}
 .board>div:first-child{grid-area:l}.board .right{grid-area:r}.board .mid{grid-area:m}
 .board .s{font-size:2.6rem}.board .t{font-size:.95rem}
 .board .oncourt{font-size:.85rem}
 .qbar button{min-height:40px}
 .prow,.cols2 .prow{grid-template-columns:1fr;gap:.25rem}
 .acts{display:grid;grid-template-columns:repeat(5,1fr)}
 .acts button{min-width:0;min-height:48px;font-size:.82rem;padding:0 .1rem}
 .sheet{max-height:92vh;padding:.8rem .8rem calc(1rem + env(safe-area-inset-bottom,0px))}
 .sheet .chip{padding:.45rem .6rem}
 .tabs,.postrow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
 .tabs .chip,.postrow .chip{flex:0 0 auto;min-height:40px}
 .tabs .kbd{display:none}
}

.sheet,.sheet *{font-family:inherit}
.sheet h3{font:inherit;font-weight:700;font-size:1.1rem}
.sg .chip{background:color-mix(in srgb,var(--c) 22%,var(--chip));border-color:transparent;font-weight:600}
.sg .chip.on{background:var(--c);color:#0e1420;box-shadow:0 0 0 2px #fff inset}
.acts{display:grid!important;grid-template-columns:repeat(60,1fr)!important;gap:.3rem}
.acts button{min-width:0!important;border:0!important;color:#fff!important;font-weight:700}
.acts button.a-ok{background:#2e9d6a}.acts button.a-ko{background:#d24a37}
.acts button.a-reb{background:#2f5fa8}
.acts button.a-ok2{background:#1f7a52}.acts button.a-ko2{background:#b5532b}
.acts button.a-st{background:#1f8f86}.acts button.a-foul{background:#b8860b}.acts button.a-fs{background:#7b4fc9}

.acts button.a-rebd{background:#5ec4f0;color:#0e1420!important}
html.lock,html.lock body{overflow:hidden;overscroll-behavior:none}
.sheetbg{overscroll-behavior:contain;touch-action:none}
.sheet{overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.urbar{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.5rem}
.urbar .btn{width:100%;min-height:50px}
.btn.redo{background:#e9b500;color:#111}
.bigclk{display:block;width:100%;min-height:64px;font-size:1.25rem;margin-bottom:.6rem;color:#fff}
.bigclk.go{background:var(--made)}.bigclk.stop{background:var(--miss)}
.postrow .pst-att{background:#8fb1e6;color:#0e1420;border-color:#8fb1e6}
.postrow .pst-dif{background:#e79a8b;color:#0e1420;border-color:#e79a8b}
.postrow .pst-pan{background:#5b6475;color:#fff;border-color:#5b6475}
.postrow .chip{opacity:.6}.postrow .chip.on{opacity:1;box-shadow:0 0 0 3px #fff inset}

.postrow,.tabs{display:grid!important;grid-auto-flow:column;grid-auto-columns:1fr;gap:.35rem}
.postrow .chip,.tabs .chip{width:100%;padding:.45rem .1rem;font-size:.92rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ucard{border:1px solid var(--line);border-radius:10px;padding:.6rem;margin:.5rem 0}.ucard .um{font-weight:700;margin-bottom:.35rem;word-break:break-all}

.acts button.a-ok{background:var(--made)!important}.acts button.a-ko{background:var(--miss)!important}
.acts button.a-ok2{background:#9be37a!important;color:#0e1420!important}
.postrow .chip{opacity:1!important;font-weight:700}
.postrow .pst-att{background:#2f6fd6!important;color:#fff!important;border-color:#2f6fd6!important}
.postrow .pst-dif{background:#d6455a!important;color:#fff!important;border-color:#d6455a!important}
.postrow .pst-pan{background:#6b7385!important;color:#fff!important;border-color:#6b7385!important}
.postrow .pst-tutto{background:#b8860b!important;color:#fff!important;border-color:#b8860b!important}
.postrow .chip:not(.on){filter:saturate(.55) brightness(.75)}
.postrow .chip.on{box-shadow:0 0 0 3px #fff inset}
@media print{.top,.noprint{display:none!important}body{background:#fff}.panel{border:0;break-inside:avoid}body.print-report .layout2{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="top"><div class="nav" id="nav"></div><div id="net" style="display:none;background:var(--amber);color:#111;font-weight:600;padding:.3rem .8rem;text-align:center"></div></div>
<main id="main"><div class="empty">Caricamento dati…</div></main>
<div id="sheet"></div>
<div id="toast"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.2/dist/umd/supabase.js"></script>
<script>
"use strict";
/* ---------- utilità ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=o=>JSON.parse(JSON.stringify(o));
const pct=(m,a)=>a&&m<=a?Math.round(m*100/a)+'%':'–';
const r1=x=>Math.round(x*10)/10;
const qlen=q=>q<=4?600:300;
function gtOf(q,clk){let t=0;for(let i=1;i<q;i++)t+=qlen(i);return t+(qlen(q)-clk)}
const qName=q=>!q?'':q<=4?q+'°':'S'+(q-4);
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
let toastT;function toast(m){const t=$('#toast');t.innerHTML='<div class="toast">'+esc(m)+'</div>';clearTimeout(toastT);toastT=setTimeout(()=>t.innerHTML='',2600)}

/* ---------- archivio: db condiviso, con coda offline ---------- */
const store=(()=>{
  let db=null;const LSK='teamstats-v1';let mem={};let pend=[];
  try{mem=JSON.parse(localStorage.getItem(LSK)||'{}')}catch(e){}
  try{pend=JSON.parse(localStorage.getItem('teamstats-pending')||'[]')}catch(e){}
  const savePend=()=>{try{localStorage.setItem('teamstats-pending',JSON.stringify(pend))}catch(e){}};
  const subs=[];const save=()=>{try{localStorage.setItem(LSK,JSON.stringify(mem))}catch(e){}};
  const colDocs=p=>Object.keys(mem).filter(k=>k.startsWith(p+'/')&&!k.slice(p.length+1).includes('/')).map(k=>({id:k.slice(p.length+1),...mem[k]}));
  const docOf=p=>mem[p]?{id:p.split('/').pop(),...mem[p]}:null;
  const notify=()=>subs.forEach(s=>s.cb(s.doc?docOf(s.p):colDocs(s.p)));
  const err=e=>{if(!navigator.onLine)return;toast('Errore archivio: '+(e&&e.code||'sconosciuto'))};
  const parent=p=>p.slice(0,p.lastIndexOf('/'));const leaf=p=>p.slice(p.lastIndexOf('/')+1);
  const watchers=[];
  const mergeCol=(p,docs)=>{const m=new Map(docs.map(d=>[d.id,d]));pend.forEach(o=>{if(parent(o.p)!==p)return;const id=leaf(o.p);
      if(o.op==='del')m.delete(id);else if(o.op==='set')m.set(id,{id,...o.d});else m.set(id,{...(m.get(id)||{id}),...o.d})});return[...m.values()]};
  const mergeDoc=(p,d)=>{pend.forEach(o=>{if(o.p!==p)return;if(o.op==='del')d=null;else if(o.op==='set')d={id:leaf(p),...o.d};else d={...(d||{id:leaf(p)}),...o.d}});return d};
  const emit=w=>w.cb(w.doc?mergeDoc(w.p,w.last):mergeCol(w.p,w.last||[]));
  const emitAll=()=>watchers.forEach(emit);
  const run=o=>{const r=db.doc(o.p);return o.op==='set'?r.set(o.d):o.op==='update'?r.update(o.d):r.delete()};
  const timeout=(pr,ms)=>Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))]);
  let flushing=false;
  async function flush(){if(flushing||!db||!pend.length||!navigator.onLine)return;flushing=true;

    const o={op,p,d};
    if(!navigator.onLine||pend.length){pend.push(o);savePend();emitAll();updNet();flush();return}
    try{await timeout(run(o),6000)}catch(e){if(e&&e.code==='invalid_argument')throw e;pend.push(o);savePend();emitAll();updNet()}
  }

    setDb(d){db=d;flush()},get remote(){return!!db},get pending(){return pend.length},
    watch(p,cb){if(db){const w={p,cb,last:[]};watchers.push(w);if(pend.length)emit(w);const u=db.collection(p).onSnapshot(s=>{w.last=s.docs.map(d=>({id:d.id,...d.data()}));emit(w)},err);return()=>{u();const i=watchers.indexOf(w);if(i>=0)watchers.splice(i,1)}}

    watchDoc(p,cb){if(db){const w={p,cb,last:null,doc:1};watchers.push(w);const u=db.doc(p).onSnapshot(s=>{w.last=s.exists?{id:s.id,...s.data()}:null;emit(w)},err);return()=>{u();const i=watchers.indexOf(w);if(i>=0)watchers.splice(i,1)}}
      const s={p,cb,doc:1};subs.push(s);cb(docOf(p));return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}},
    async list(p){if(db){const s=await db.collection(p).get();return mergeCol(p,s.docs.map(d=>({id:d.id,...d.data()})))}return colDocs(p)},
    set(p,d){return write('set',p,clean(d))},update(p,d){return write('update',p,clean(d))},del(p){return write('del',p)},
    id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

function makeDb(){
  const parentOf=p=>p.slice(0,p.lastIndexOf('/')),leaf=p=>p.slice(p.lastIndexOf('/')+1);
  const colW=new Map(),docW=new Map();
  const snapCol=rows=>({docs:rows.map(r=>({id:leaf(r.path),exists:true,data:()=>r.data}))});
  const snapDoc=(p,r)=>({id:leaf(p),exists:!!r,data:()=>r?r.data:undefined});
  async function fetchCol(c){const out=[];let from=0;for(;;){const {data,error}=await SB.from('docs').select('path,data').eq('coll',c).range(from,from+999);if(error)throw error;out.push(...data);if(data.length<1000)break;from+=1000}return out}
  async function fetchDoc(p){const {data,error}=await SB.from('docs').select('path,data').eq('path',p).maybeSingle();if(error)throw error;return data}
  const refresh={};
  function schedule(key,fn){clearTimeout(refresh[key]);refresh[key]=setTimeout(fn,150)}
  SB.channel('docs-all').on('postgres_changes',{event:'*',schema:'public',table:'docs'},pl=>{
    const path=(pl.new&&pl.new.path)||(pl.old&&pl.old.path);const c=(pl.new&&pl.new.coll)||(path?parentOf(path):'');
    if(c&&colW.has(c))schedule('c:'+c,()=>runCol(c));
    if(path&&docW.has(path))schedule('d:'+path,()=>runDoc(path));
    if(!path){colW.forEach((_,k)=>schedule('c:'+k,()=>runCol(k)));docW.forEach((_,k)=>schedule('d:'+k,()=>runDoc(k)))}
  }).subscribe();
  setInterval(()=>{if(document.visibilityState==='visible'){colW.forEach((_,k)=>runCol(k));docW.forEach((_,k)=>runDoc(k))}},20000);
  async function runCol(c){const ls=colW.get(c);if(!ls||!ls.size)return;try{const rows=await fetchCol(c);const sn=snapCol(rows);ls.forEach(l=>l.next(sn))}catch(e){ls.forEach(l=>l.err&&l.err({code:'unavailable'}))}}
  async function runDoc(p){const ls=docW.get(p);if(!ls||!ls.size)return;try{const r=await fetchDoc(p);const sn=snapDoc(p,r);ls.forEach(l=>l.next(sn))}catch(e){ls.forEach(l=>l.err&&l.err({code:'unavailable'}))}}
  const touch=p=>{const c=parentOf(p);if(colW.has(c))runCol(c);if(docW.has(p))runDoc(p)};
  const wrap=async(pr,p)=>{const {error}=await pr;if(!error&&p)touch(p);if(error){throw {code:error.code==='42501'||/row-level/.test(error.message||'')?'invalid_argument':'unavailable',message:error.message}}};
  return{
    collection(c){return{get:async()=>snapCol(await fetchCol(c)),onSnapshot(next,err){let s=colW.get(c);if(!s){s=new Set();colW.set(c,s)}const l={next,err};s.add(l);runCol(c);return()=>s.delete(l)}}},
    doc(p){return{
      set:d=>wrap(SB.from('docs').upsert({path:p,coll:parentOf(p),data:d,updated_at:new Date().toISOString()}),p),
      update:d=>wrap(SB.rpc('doc_merge',{p_path:p,p_data:d}),p),
      delete:()=>wrap(SB.from('docs').delete().eq('path',p),p),
      onSnapshot(next,err){let s=docW.get(p);if(!s){s=new Set();docW.set(p,s)}const l={next,err};s.add(l);runDoc(p);return()=>s.delete(l)}}}
  };
}

function poss(x){const fga=x.p2a+x.p3a;const fta=x.fta>=x.ftm?x.fta:x.ftm/0.7;return fga+0.44*fta-x.ro+x.pp}

  const ort=T.pts/pN*100,drt=A.pts/pA*100;const fga=T.p2a+T.p3a,fgm=T.p2m+T.p3m;const est=T.fta<T.ftm;
  const k=[['Possessi a gara',r1(pN/R.ngames)],['Rating offensivo',r1(ort)],['Rating difensivo',r1(drt)],['Net rating',(ort-drt>0?'+':'')+r1(ort-drt)],['Palle perse %',fmtP(T.pp/pN)],['Assist su canestri',fmtP(fgm?T.as/fgm:null)],['Quota tiri da 3',fmtP(fga?T.p3a/fga:null)],['Liberi per tiro',fga?((est?T.ftm/0.7:T.fta)/fga).toFixed(2):'–'],['Punti per tiro',fga?(T.pts/fga).toFixed(2):'–']];
  return `<div class="panel"><h3>Indicatori avanzati</h3><div class="kpis">${k.map(([l,v])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
  <p class="muted small">Ratings = punti ogni 100 possessi.${hasA?'':' Senza statistiche avversarie il rating difensivo usa i nostri possessi.'}${est?' Liberi tentati stimati dai segnati (70%) dove la scheda non li ha.':''}</p></div>`}

/* ---------- analisi ---------- */
function selGames(){const f=S.f;return S.games.filter(g=>!g.demo&&(!g.summary||f.home==='tutte')&&(g.status!=='programmata'||g.id===S.gameId)&&(f.type==='tutte'||(f.type==='partite'?g.type!=='allenamento':g.type==='allenamento'))&&(f.home==='tutte'||(f.home==='casa')===(g.home!==false))&&(f.game==='tutte'||g.id===f.game))}
async function ensureAnalysisData(){
  if(S.loading)return;const need=selGames().filter(g=>!S.cache[g.id]&&g.id!==S.gameId);if(!need.length)return;
  S.loading=true;
  const to=pr=>Promise.race([pr,new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),12000))]);
  await Promise.all(need.map(async g=>{try{const [ev,box]=await Promise.all([to(store.list('games/'+g.id+'/ev')),to(store.list('games/'+g.id+'/box'))]);S.cache[g.id]={ev:ev.filter(e=>!e.del).concat(g.evPack||[]).sort((a,b)=>a.ts-b.ts),box}}catch(e){S.cache[g.id]={ev:(g.evPack||[]).slice(),box:[],err:1}}}));
  if(need.some(g=>S.cache[g.id].err))toast('Alcune partite non sono state lette: ricarica la pagina');
  S.loading=false;render();
}
function dataOf(g){return g.id===S.gameId?{ev:S.ev.concat(g.evPack||[]),box:S.box}:S.cache[g.id]}
function blank(){return{gp:0,pt:0,min:0,pts:0,p2m:0,p2a:0,p3m:0,p3a:0,ftm:0,fta:0,ro:0,rd:0,as:0,pp:0,pr:0,ff:0,fs:0,st:0,pm:0}}
function timeline(g,evs,team){
  const subs=evs.filter(e=>e.k==='sub'&&e.team===team).sort((a,b)=>a.gt-b.gt||a.ts-b.ts);
  let on=new Set(),last=0;const iv={},lu=[];
  const close=t=>{if(t>last){on.forEach(p=>(iv[p]=iv[p]||[]).push([last,t]));if(on.size)lu.push({k:[...on].sort().join('|'),a:last,b:t})}last=Math.max(last,t)};
  subs.forEach(s=>{close(s.gt);(s.out||[]).forEach(p=>on.delete(p));(s.in||[]).forEach(p=>on.add(p))});
  let end;if(g.id===S.gameId&&g.status!=='finita')end=gtOf(g.q||1,curClock(g));else{let mq=g.q||1;evs.forEach(e=>{if(e.q>mq)mq=e.q});end=gtOf(mq,0)}
  close(end);return{iv,lu};
}
const overlap=(x,y,a,b)=>Math.max(0,Math.min(y,b)-Math.max(x,a));
function compute(){
  const f=S.f;const games=selGames();const R={pl:{},opp:{},teamN:blank(),teamA:blank(),shotsN:[],shotsA:[],byQ:{},orig:{},sch:{},cont:{},defFaced:{},ourDef:{},defenders:{},match:{},lineups:{},prog:[],ngames:0,boxUsed:0,missing:0};
  const P=id=>R.pl[id]=R.pl[id]||blank();
  const qOk=e=>!f.q||(f.q===5?e.q>=5:e.q===f.q);
  const [ra,rb]=f.q?(f.q===5?[2400,99999]:[gtOf(f.q,qlen(f.q)),gtOf(f.q,0)]):[0,99999];
  games.forEach(g=>{const d=dataOf(g);if(!d){R.missing++;return}if(!g.summary&&(d.ev.length||d.box.length||g.score))R.ngames++;
    const evs=d.ev;
    // minuti
    const tn=g.noClock?{iv:{},lu:[]}:timeline(g,evs,'N'),ta=g.noClock?{iv:{},lu:[]}:timeline(g,evs,'A');
    if(g.noClock){const on=new Set();evs.filter(e=>e.k==='sub'&&e.team==='N').forEach(e=>(e.in||[]).forEach(x=>on.add(x)));on.forEach(x=>{tn.iv[x]=[]})}
    for(const p in tn.iv)P(p).min+=tn.iv[p].reduce((s,[x,y])=>s+overlap(x,y,ra,rb),0)/60;
    if(f.game!=='tutte')for(const n in ta.iv){const o=R.opp[n]=R.opp[n]||{...blank(),q:{}};o.min+=ta.iv[n].reduce((s,[x,y])=>s+overlap(x,y,ra,rb),0)/60}
    tn.lu.forEach(l=>{const m=overlap(l.a,l.b,ra,rb)/60;if(m<=0)return;const L=R.lineups[l.k]=R.lineups[l.k]||{min:0,pf:0,pa:0};L.min+=m});
    if(g.noClock)R.noClockGame=true;
    let sN=0,sA=0;if(f.game!=='tutte')R.prog.push({gt:0,N:0,A:0});
    const qIdx={},qCnt={};if(g.noClock){evs.forEach(e=>{if(e.paper)return;qCnt[e.q]=(qCnt[e.q]||0)+1});}
    const gtX=e=>{if(!g.noClock)return e.gt;const q=e.q||1;qIdx[q]=(qIdx[q]||0)+1;const len=q<=4?600:300;let base=0;for(let i=1;i<q;i++)base+=i<=4?600:300;return base+qIdx[q]/((qCnt[q]||1)+1)*len};
    evs.forEach(e=>{
      const pts=e.nopts?0:((e.k==='shot'&&e.made)||e.k==='ftm'?(e.pts||0):0);
      if(pts&&f.game!=='tutte'&&!e.paper){if(e.team==='N')sN+=pts;else sA+=pts;R.prog.push({gt:gtX(e),N:sN,A:sA,q:e.q})}
      if(!qOk(e)||e.k==='sub')return;
      const N=e.team==='N';const T=N?R.teamN:R.teamA;
      if(!e.paper){const Q=R.byQ[e.q]=R.byQ[e.q]||{N:0,A:0};if(pts)Q[N?'N':'A']+=pts}
      // +/- e quintetti
      if(pts){(e.lnN||[]).forEach(p=>{P(p).pm+=N?pts:-pts});const k=(e.lnN||[]).slice().sort().join('|');if(R.lineups[k]){if(N)R.lineups[k].pf+=pts;else R.lineups[k].pa+=pts}}
      if(e.nostat){if(pts)T.pts+=pts;return}
      if(e.k==='shot'&&e.made==null)return;
      const tgt=!e.p?null:N?P(e.p):(f.game!=='tutte'?(R.opp[e.p]=R.opp[e.p]||{...blank(),q:{}}):null);
      const add=(k,v=1)=>{T[k]+=v;if(tgt)tgt[k]+=v};
      if(!N&&tgt&&pts){tgt.q[e.q]=(tgt.q[e.q]||0)+pts}
      if(e.k==='shot'){
        add(e.three?'p3a':'p2a');if(e.made){add(e.three?'p3m':'p2m');if(e.nopts){if(tgt)tgt.pts+=e.pts}else add('pts',e.pts)}
        if(N){R.shotsN.push(e);if(e.made&&e.ast){P(e.ast).as++;T.as++}
          const o=R.orig[e.orig||'nd']=R.orig[e.orig||'nd']||{a:0,m:0,p:0};o.a++;if(e.made){o.m++;o.p+=e.pts}
          if(e.sch){const s=R.sch[e.sch]=R.sch[e.sch]||{a:0,m:0,p:0};s.a++;if(e.made){s.m++;s.p+=e.pts}}
          const c=R.cont[e.cont?'Contestato':e.cont===false?'Libero':'Non indicato']=R.cont[e.cont?'Contestato':e.cont===false?'Libero':'Non indicato']||{a:0,m:0,p:0};c.a++;if(e.made){c.m++;c.p+=e.pts}
          if(e.defA){const df=R.defFaced[e.defA]=R.defFaced[e.defA]||{a:0,m:0,p:0};df.a++;if(e.made){df.m++;df.p+=e.pts}}}
        else{R.shotsA.push(e);if(e.made&&e.ast)T.as++;
          if(e.defN){const df=R.ourDef[e.defN]=R.ourDef[e.defN]||{a:0,m:0,p:0};df.a++;if(e.made){df.m++;df.p+=e.pts}}
          if(e.dfd){const D=R.defenders[e.dfd]=R.defenders[e.dfd]||{a:0,m:0,p:0,cont:0,z:{}};D.a++;if(e.made){D.m++;D.p+=e.pts}if(e.cont)D.cont++;
            const z=D.z[e.zone]=D.z[e.zone]||{a:0,m:0};z.a++;if(e.made)z.m++;
            if(f.game!=='tutte'){const k=e.dfd+'|'+e.p;const M=R.match[k]=R.match[k]||{a:0,m:0,p:0};M.a++;if(e.made){M.m++;M.p+=e.pts}}}}
      }else if(e.k==='ftm'){add('ftm');add('fta');add('pts',1)}
      else if(e.k==='ftx')add('fta');
      else add(e.k);
    });
    const seen=new Set();evs.forEach(e=>{if(e.team==='N'&&e.k!=='sub'&&e.p&&!e.paper)seen.add(e.p)});for(const p in tn.iv)seen.add(p);seen.forEach(p=>{if(pl(p))P(p).gp++});
    if(!f.q&&d.box&&d.box.length){R.boxUsed++;d.box.forEach(b=>{const x=P(b.id);BOXK.forEach(([k])=>{const v=+b[k]||0;x[k]+=v;if(k!=='min'&&k!=='gp'&&k!=='pt')R.teamN[k]+=v});let bp=(+b.p2m||0)*2+(+b.p3m||0)*3+(+b.ftm||0);if(!bp&&+b.pt)bp=+b.pt;x.pts+=bp;R.teamN.pts+=bp;if(b.gp==null||b.gp==='')x.gp+=1})}
    if(g.qs&&!evs.some(e=>!e.paper)){let pN=0,pA=0;g.qs.forEach(([n,a],i)=>{const q=i+1;if(!f.q||f.q===q){const Q=R.byQ[q]=R.byQ[q]||{N:0,A:0};Q.N+=n-pN;Q.A+=a-pA}pN=n;pA=a})}
    if(!f.q&&g.boxOpp!=null&&!(d.ev||[]).some(e=>e.team==='A'))R.teamA.pts+=+g.boxOpp||0;
  });
  return R;
}
const eff=x=>{const fga=x.p2a+x.p3a,fgm=x.p2m+x.p3m;if(fgm>fga||x.ftm>x.fta)return{efg:fga&&fgm<=fga?(fgm+.5*x.p3m)/fga:null,ts:null};return{efg:fga?(fgm+.5*x.p3m)/fga:null,ts:(fga+x.fta)?x.pts/(2*(fga+.44*x.fta)):null}};

function zoneAgg(shots){const z={};shots.forEach(e=>{const o=z[e.zone]=z[e.zone]||{a:0,m:0};o.a++;if(e.made)o.m++});return z}
function viewAnalisi(){

async function svgToImg(root){
  const props=['fill','stroke','stroke-width','opacity','font-family','font-size','font-weight','text-anchor','dominant-baseline'];
  for(const sv of [...root.querySelectorAll('svg')]){const r=sv.getBoundingClientRect();if(!r.width)continue;
    const cl=sv.cloneNode(true);const src=[sv,...sv.querySelectorAll('*')],dst=[cl,...cl.querySelectorAll('*')];
    src.forEach((el,i)=>{const cs=getComputedStyle(el);props.forEach(p=>{const v=cs.getPropertyValue(p);if(v)dst[i].setAttribute(p,v)});dst[i].removeAttribute('class')});
    const sc=2,W=Math.round(r.width),H=Math.round(r.height);cl.setAttribute('width',W*sc);cl.setAttribute('height',H*sc);cl.setAttribute('xmlns','http://www.w3.org/2000/svg');
    const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(cl));
    const im=new Image();await new Promise(res=>{im.onload=res;im.onerror=res;im.src=url});
    const c=document.createElement('canvas');c.width=W*sc;c.height=H*sc;c.getContext('2d').drawImage(im,0,0);
    const img=document.createElement('img');img.src=c.toDataURL('image/png');img.style.cssText=`width:${W}px;height:${H}px;display:block;margin:0 auto`;sv.replaceWith(img)}
}

async function savePdf(body,filename){

  const root=document.documentElement,prevTheme=root.getAttribute('data-theme');root.setAttribute('data-theme','light');

  box.querySelectorAll('svg').forEach(sv=>{const r=sv.getBoundingClientRect();const vb=(sv.getAttribute('viewBox')||'0 0 150 140').split(' ').map(Number);const w=Math.max(10,r.width);sv.setAttribute('width',w);sv.setAttribute('height',w*vb[3]/vb[2]);sv.style.width=w+'px';sv.style.height=(w*vb[3]/vb[2])+'px'});
  try{const opt={margin:[8,8,8,8],image:{type:'jpeg',quality:.92},html2canvas:{scale:2,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css'],avoid:['.panel','tr','svg','.kpi']}};

    await svgToImg(box);

    const blob=await w.outputPdf('blob');

  }catch(e){toast('PDF non riuscito')}finally{wrap.remove();cover.remove();if(prevTheme)root.setAttribute('data-theme',prevTheme);else root.removeAttribute('data-theme')}
}

    case'ev':{const k=b.dataset.k;const p=b.dataset.p;S.actTeam=b.dataset.t;await addEv({...baseEv(),k,team:S.actTeam,p,pts:k==='ftm'?1:0});
      if(k==='ff'){const n=S.ev.filter(e=>e.k==='ff'&&e.team===S.actTeam&&e.p===p).length+1;const tq=S.ev.filter(e=>e.k==='ff'&&e.team===S.actTeam&&e.q===(g.q||1)).length+1;
        toast(n>=5?'5° fallo: '+(S.actTeam==='N'?pShort(p):oName(g,p))+' esce':n===4?'Attenzione: 4° fallo per '+(S.actTeam==='N'?pShort(p):oName(g,p)):tq===4?'4 falli di squadra: dal prossimo bonus':'Fallo registrato')}else toast('Registrato');break}
    case'flip':await patchGame({flip:!isFlip()});toast('Campo invertito');break;
    case'post':{S.post=v;try{localStorage.setItem('ts-post',v)}catch(e){}S.tab=v==='pan'?'azioni':'tiri';render();break}
    case'undo':{const last=myLast();if(!last)break;try{const{id,...d}=last;await store.update('games/'+S.gameId+'/ev/'+id,{del:true,delBy:S.email||'',delTs:Date.now(),delUndo:true});redoPush(S.gameId,{id,d});toast('Annullato: '+evDesc(last,g).replace(/<[^>]+>/g,''))}catch(e){toast('Non riuscito')}break}
    case'redo':{const st=redoGet(S.gameId);const it=st.pop();if(!it)break;redoSet(S.gameId,st);try{await store.set('games/'+S.gameId+'/ev/'+it.id,it.d);toast('Rifatto: '+evDesc(it.d,g).replace(/<[^>]+>/g,''))}catch(e){toast('Non riuscito')}render();break}
    case'noClock':{if(g.run)await patchGame({clk:Math.round(curClock(g)),run:null});await patchGame({noClock:!g.noClock});break}
    case'evEdit':{const e=S.ev.find(x=>x.id===v);if(!e)break;if(e.k==='shot')S.sheet={type:'shot',editId:e.id,team:e.team,x:e.x,y:e.y,zone:e.zone,p:e.p||null,made:e.made??null,orig:e.orig||null,ast:e.ast||null,sch:e.sch||null,cont:e.cont??null,dfd:e.dfd||null,q:e.q};
      else if(e.k==='sub')toast('I cambi non si modificano: eliminalo e rifallo');else S.sheet={type:'evEdit',editId:e.id,team:e.team,k:e.k,p:e.p,q:e.q};renderSheet();break}
    case'ee':{const f=S.sheet;f[b.dataset.k]=b.dataset.k==='q'?+v:v;renderSheet();break}
    case'eeSave':{const f=S.sheet;await store.update('games/'+S.gameId+'/ev/'+f.editId,{k:f.k,p:f.p,q:f.q,pts:f.k==='ftm'?1:0,mod:S.email||'',modTs:Date.now()});S.sheet=null;renderSheet();toast('Evento modificato');break}
    case'rsort':{const t=S.rs;if(t.k===v)t.d=-t.d;else{t.k=v;t.d=1}render();break}
    case'evDel':S.sheet={type:'confirm',title:'Eliminare questo evento?',text:'Resta nel registro barrato, con il tuo nome, e non conta più nelle statistiche. Si può ripristinare.',run:()=>store.update('games/'+S.gameId+'/ev/'+v,{del:true,delBy:S.email||'',delTs:Date.now()})};renderSheet();break;
    case'showDel':S.showDel=!S.showDel;render();break;
    case'evRestore':await store.update('games/'+S.gameId+'/ev/'+v,{del:false,resBy:S.email||'',resTs:Date.now()});toast('Evento ripristinato');break;
    case'confirmYes':{const r=S.sheet.run;S.sheet=null;renderSheet();try{await r()}catch(e){toast('Operazione non riuscita')}break}
    case'sheetClose':S.sheet=null;renderSheet();break;
    case'subT':{const s=S.subSel[b.dataset.t][b.dataset.d];const i=s.indexOf(v);if(i>=0)s.splice(i,1);else s.push(v);render();break}
    case'subOk':{const t=v;const s=S.subSel[t];const key=t==='N'?'lnN':'lnA';const on=g[key]||[];
      const next=on.filter(x=>!s.out.includes(x)).concat(s.in);
      if(!s.in.length&&!s.out.length){toast('Seleziona chi entra e chi esce');break}
      if(next.length>5){toast('In campo risulterebbero '+next.length+' giocatori');break}
      await addEv({...baseEv(),k:'sub',team:t,in:s.in.slice(),out:s.out.slice()});await patchGame({[key]:next});
      S.subSel[t]={in:[],out:[]};toast(next.length<5?'Cambio registrato: in campo '+next.length:'Cambio registrato');break}
    case'oppDel':{S.sheet={type:'confirm',title:'Togliere il numero '+v+' dagli avversari?',text:'Gli eventi già registrati con questo numero restano nel registro.',yes:'Togli',run:async()=>{const r=(g.oppRoster||[]).filter(o=>o.n!==v);const mm={...(g.mm||{})};delete mm[v];await patchGame({oppRoster:r,lnA:(g.lnA||[]).filter(x=>x!==v),mm})}};renderSheet();break}
    case'oppAdd':{const n=($('#oppn').value||'').trim();if(!n)break;const r=(g.oppRoster||[]).filter(o=>o.n!==n);r.push({n,name:($('#oppname').value||'').trim()});await patchGame({oppRoster:r});$('#oppn').value='';$('#oppname').value='';render();break}
    case'def':await patchGame({[b.dataset.t==='N'?'defN':'defA']:v});break;
    case'pAdd':{const n=$('#pn').value.trim(),last=$('#plast').value.trim(),first=$('#pfirst').value.trim();if(!last){toast('Serve il cognome');break}
      await store.set('players/'+store.id(),{n,last,first,name:(last+' '+first).trim(),role:$('#prole').value,active:true});document.activeElement.blur();render();break}
    case'pAct':{const p=pl(v);await store.update('players/'+v,{active:p.active===false});break}
    case'pDel':S.sheet={type:'confirm',title:'Eliminare '+pName(v)+'?',text:'Le sue statistiche già registrate restano nelle partite ma senza nome. Per toglierlo dalle liste basta renderlo non attivo.',run:()=>store.del('players/'+v)};renderSheet();break;
    case'teamSave':await store.set('meta/settings',{...S.settings,team:$('#tname').value.trim()});document.activeElement.blur();toast('Salvato');render();break;
    case'schAdd':{const s=$('#sch').value.trim();if(!s)break;const l=[...new Set([...(S.settings.schemi||[]),s])];await store.set('meta/settings',{...S.settings,schemi:l});$('#sch').value='';document.activeElement.blur();render();break}
    case'schDel':await store.set('meta/settings',{...S.settings,schemi:(S.settings.schemi||[]).filter(x=>x!==v)});break;
    case'gNew':S.sheet={type:'game',g:null};renderSheet();break;
    case'gEdit':S.sheet={type:'game',g:S.games.find(x=>x.id===v)};renderSheet();break;
    case'gSave':{const old=S.sheet.g;const ros=$('#groster').value.split(',').map(s=>s.trim()).filter(Boolean).map(s=>{const m=s.match(/^(\S+)\s*(.*)$/);return{n:m[1],name:m[2]||''}});
      const d={date:$('#gdate').value,type:$('#gtype').value,opp:$('#gopp').value.trim(),home:$('#ghome').value==='1',oppRoster:ros,status:$('#gstatus').value};
      if(old)await store.update('games/'+old.id,d);else{const id=store.id();await store.set('games/'+id,{...d,q:1,clk:600,run:null,lnN:[],lnA:[],defN:'uomo',defA:'uomo'});if(d.status==='in corso'){selectGame(id);S.view='live'}}
      S.sheet=null;render();break}
    case'gLive':selectGame(v);S.view='live';render();break;
    case'gReset':{const gg=S.games.find(x=>x.id===v)||{};S.sheet={type:'confirm',title:'Azzerare i dati di '+(gg.opp||'questa partita')+'?',text:'Cancello eventi, punteggio, tabellino, quintetti e marcature e riporto al 1° quarto, 10:00. Restano data, avversario e numeri avversari. Non si può annullare.',yes:'Azzera',run:async()=>{const evs=await store.list('games/'+v+'/ev');for(const e of evs)await store.del('games/'+v+'/ev/'+e.id);const bx=await store.list('games/'+v+'/box');for(const x of bx)await store.del('games/'+v+'/box/'+x.id);await store.update('games/'+v,{q:1,clk:600,run:null,lnN:[],lnA:[],mm:{},defN:'',defA:'',flip:false,noClock:false,score:null,paper:false,status:'programmata'});try{localStorage.removeItem('ts-redo-'+v)}catch(e){}S.cache={};toast('Partita azzerata')}};renderSheet();break}
    case'gDel':S.sheet={type:'confirm',title:'Eliminare la partita?',text:'Spariscono anche tutti gli eventi e il tabellino. Non si può annullare.',run:async()=>{const evs=await store.list('games/'+v+'/ev');for(const e of evs)await store.del('games/'+v+'/ev/'+e.id);const bx=await store.list('games/'+v+'/box');for(const x of bx)await store.del('games/'+v+'/box/'+x.id);await store.del('games/'+v);if(S.gameId===v)selectGame(null)}};renderSheet();break;
    case'gBox':{const bx=await store.list('games/'+v+'/box');const rows={};bx.forEach(x=>rows[x.id]=x);const gg=S.games.find(x=>x.id===v);S.sheet={type:'box',gid:v,rows,opp:gg&&gg.boxOpp};renderSheet();break}
    case'boxSave':{const sh=S.sheet;readBoxInputs();for(const p of sortedPlayers()){const r=sh.rows[p.id];const has=r&&BOXK.some(([k])=>+r[k]);const path='games/'+sh.gid+'/box/'+p.id;
        if(has){const o={};BOXK.forEach(([k])=>o[k]=+r[k]||0);await store.set(path,o)}else if(r&&r._saved!==false)try{await store.del(path)}catch(e){}}
      const op=$('#boxopp').value;await store.update('games/'+sh.gid,{boxOpp:op===''?null:+op});delete S.cache[sh.gid];S.sheet=null;render();toast('Tabellino salvato');break}
    case'map':S.f.map=v;render();break;
    case'lstAdd':{const k=b.dataset.k;const val=($('#lst_'+k).value||'').trim();if(!val)break;const cur=k==='schemiDif'?defList():(S.settings[k]||[]);await store.set('meta/settings',{...S.settings,[k]:[...new Set([...cur,val])]});document.activeElement.blur();render();break}
    case'lstDel':{const k=b.dataset.k;const cur=k==='schemiDif'?defList():(S.settings[k]||[]);await store.set('meta/settings',{...S.settings,[k]:cur.filter(x=>x!==v)});break}
    case'demo':await makeDemo();break;
    case'demoDel':{const ds=S.games.filter(x=>x.demo);S.sheet={type:'confirm',title:'Eliminare '+ds.length+' partite di prova?',text:'Le partite reali non vengono toccate.',run:async()=>{for(const x of ds){if(!x.evPack){const evs=await store.list('games/'+x.id+'/ev');for(const e of evs)await store.del('games/'+x.id+'/ev/'+e.id)}await store.del('games/'+x.id);if(S.gameId===x.id)selectGame(null)}}};renderSheet();break}
    case'tsort':{const t=S.tf;if(t.sort===v)t.dir=-t.dir;else{t.sort=v;t.dir=-1}render();break}
    case'trole':{const r=S.tf.roles;const i=r.indexOf(v);if(i>=0)r.splice(i,1);else r.push(v);render();break}
    case'tcAdd':{const col=$('#tc_col').value,op=$('#tc_op').value,val=parseFloat(($('#tc_val').value||'').replace(',','.'));if(isNaN(val)){toast('Inserisci un numero');break}S.tf.conds.push({col,op,val});document.activeElement.blur();render();break}
    case'tcDel':S.tf.conds.splice(+v,1);render();break;
    case'csv':await exportCSV();break;
    case'avg':S.f.avg=v==='1';render();break;
    case'pick':S.f.player=v;render();window.scrollTo(0,0);break;
    case'dlReport':{S.allMaps=true;let body;try{body=cleanReport(`<p class="muted small">${esc(S.settings.team||'')}, generato il ${new Date().toLocaleDateString('it-IT')}</p>`+playerReport(compute(),v))}finally{S.allMaps=false}
      await savePdf(body,'scheda-'+(pl(v)?.name||'giocatore').replace(/\W+/g,'-')+'.pdf');break}
  }
});
function readBoxInputs(){document.querySelectorAll('[data-box]').forEach(i=>{const [id,k]=i.dataset.box.split('|');const r=S.sheet.rows[id]=S.sheet.rows[id]||{};r[k]=i.value===''?'':+i.value})}
document.addEventListener('change',async ev=>{
  const t=ev.target;
  if(t.dataset.ur||t.dataset.up){const e=t.dataset.ur||t.dataset.up;const d=t.dataset.ur?{role:t.value}:{player_id:t.value||null};const {error}=await SB.from('app_users').update(d).eq('email',e);if(error)toast('Non salvato');S.users=null;t.blur();render();return}
  if(t.dataset.mmour&&S.game){const mm={...(S.game.mm||{})};for(const o in mm)if(mm[o]===t.dataset.mmour)delete mm[o];if(t.value)mm[t.value]=t.dataset.mmour;await patchGame({mm});return}
  if(t.dataset.mm!=null&&S.game){const mm={...(S.game.mm||{})};if(t.value)mm[t.dataset.mm]=t.value;else delete mm[t.dataset.mm];await patchGame({mm});return}
  if(t.dataset.pf){const [id,k]=t.dataset.pf.split('|');const p=pl(id);if(!p)return;const d={[k]:t.value.trim()};
    if(k==='last'||k==='first'){const last=k==='last'?d.last:(p.last??p.name??''),first=k==='first'?d.first:(p.first??'');d.last=last;d.first=first;d.name=(last+' '+first).trim()}
    try{await store.update('players/'+id,d)}catch(e){toast('Modifica non salvata')}t.blur();render();return}
  if(t.dataset.a==='gsel'){selectGame(t.value||null);render();return}
  if(t.dataset.f){const k=t.dataset.f;S.f[k]=k==='q'?+t.value:t.value;if(k==='game'&&t.value!=='tutte')S.f.type='tutte',S.f.home='tutte';render();return}
  if(t.id==='impjson'&&t.files[0]){await importJSON(t.files[0]);t.value='';return}
  if(t.id==='boxphoto'&&t.files[0]){readBoxInputs();await photoImport(t.files[0])}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&S.authMode&&!S.role&&document.querySelector('[data-a="auth"]')){e.preventDefault();doAuth(S.authMode);return}
  if(e.key==='Escape'&&S.sheet){S.sheet=null;renderSheet();return}
  const tg=e.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT'))return;
  if(S.view!=='live'||!S.game)return;
  if(e.code==='Space'&&!S.sheet&&!S.game.noClock){e.preventDefault();const b=document.querySelector('[data-a="clk"]');if(b)b.click();return}
  if((e.metaKey||e.ctrlKey||e.altKey)&&/^Digit[1-5]$/.test(e.code)){e.preventDefault();S.tab=['tiri','azioni','cambi','registro','live'][+e.code.slice(5)-1];S.sheet=null;render()}
});

/* ---------- import da foto ---------- */
async function shrink(file){const img=await createImageBitmap(file);const sc=Math.min(1,1800/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.85))}
async function photoImport(file){
  const st=m=>{S.sheet.msg=m;const e=$('#photostat');if(e)e.textContent=m};
  let sample=null;
  if(!sample){st('Lettura da foto non disponibile in questa vista.');return}
  const lim=await sample.limits().catch(()=>null);if(!lim||!lim.images){st('Questa vista non può inviare immagini.');return}
  st('Lettura della scheda in corso…');
  try{const blob=await shrink(file);
    const roster=sortedPlayers().map(p=>({id:p.id,numero:p.n,nome:p.name}));
    const prompt=`L'immagine è una scheda statistiche cartacea di una partita di basket (tabellino). Estrai le righe dei giocatori della squadra di casa della scheda. Roster noto: ${JSON.stringify(roster)}.
Rispondi SOLO con JSON: {"punti_avversari": numero o null, "righe":[{"numero":"","nome":"","min":n,"p2m":n,"p2a":n,"p3m":n,"p3a":n,"ftm":n,"fta":n,"ro":n,"rd":n,"as":n,"pp":n,"pr":n,"ff":n,"fs":n,"st":n}]}.
p2m/p2a = tiri da 2 segnati/tentati, p3m/p3a = da 3, ftm/fta = liberi, ro/rd rimbalzi offensivi/difensivi, as assist, pp palle perse, pr palle recuperate, ff falli fatti, fs falli subiti, st stoppate. Se un valore non è leggibile o non esiste usa null. Non inventare numeri.`;
    const out=await sample.json(prompt,{images:[blob],modelTier:'complex'});
    const un=[];let n=0;
    (out.righe||[]).forEach(r=>{const p=sortedPlayers().find(x=>String(x.n)===String(r.numero))||sortedPlayers().find(x=>r.nome&&x.name.toLowerCase().includes(String(r.nome).toLowerCase()));
      if(!p){un.push((r.numero||'')+' '+(r.nome||''));return}n++;const row=S.sheet.rows[p.id]=S.sheet.rows[p.id]||{};BOXK.forEach(([k])=>{if(r[k]!=null&&r[k]!=='')row[k]=+r[k]})});
    if(out.punti_avversari!=null)S.sheet.opp=out.punti_avversari;S.sheet.unmatched=un;S.sheet.msg=n+' righe lette. Controlla i numeri prima di salvare.';renderSheet();
  }catch(e){st(e.code==='not_granted'?'Permesso negato.':e.code==='rate_limited'?'Troppe richieste, riprova tra poco.':'Lettura non riuscita: inserisci i dati a mano.')}
}
let wl=null;async function keepAwake(){try{if(S.view==='live'&&S.game&&navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake()});setInterval(keepAwake,5000);
init();
</script>
